<html lang="en">
<head>

<meta name="description" content="Bilingual driver ELD quick guide / Guía rápida bilingüe para conductores.">
<title>Driver Help Center | Centro de ayuda para conductores</title>
<style>
:root{--navy:#102b46;--blue:#1769aa;--pale:#eef5fb;--ink:#17212b;--muted:#617181;--line:#dce4eb;--green:#17834b}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:17px/1.55 Arial,Helvetica,sans-serif}
header{background:var(--navy);color:white;padding:22px 18px}.wrap{max-width:1050px;margin:auto;padding:0 16px}
.brand{font-weight:800;font-size:25px}.sub{color:#d5e4f1;margin-top:4px}main{padding:22px 0 50px}
.intro,.content,nav{background:white;border:1px solid var(--line);border-radius:15px;padding:18px}.intro{margin-bottom:18px}
h1{font-size:25px;line-height:1.2;margin:0 0 8px}h2{font-size:21px;margin:0 0 10px}h3{font-size:18px;margin:0 0 8px}
p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;font-size:15px;cursor:pointer}
.tab{background:#e8eef4;color:var(--navy)}.tab.active,button.primary{background:var(--blue);color:white}
.search{width:100%;padding:14px;border:1px solid #cbd5df;border-radius:11px;font-size:17px;margin:15px 0 6px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
nav{position:sticky;top:12px;padding:12px}nav button{display:block;width:100%;text-align:left;background:white;color:var(--ink);padding:11px;margin:2px 0;font-weight:600}
nav button.active{background:var(--pale);color:var(--blue)}.section{display:none}.section.active{display:block}
.step{border:1px solid var(--line);border-radius:13px;padding:15px;margin:13px 0;background:white}
.stepnum{display:inline-flex;background:var(--pale);color:var(--blue);font-weight:800;border-radius:50%;width:30px;height:30px;align-items:center;justify-content:center;margin-right:7px}
ul,ol{padding-left:23px}li{margin:8px 0}figure{margin:14px 0 4px}figure img{width:100%;height:auto;border:1px solid var(--line);border-radius:9px;background:#fff}
figcaption{font-size:13px;color:var(--muted);margin-top:5px}.callout{background:#fff7df;border-left:4px solid #e1a52b;padding:12px 14px;border-radius:8px;margin:14px 0}
.good{background:#eaf7ef;border-left:4px solid var(--green);padding:12px 14px;border-radius:8px;margin:14px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:25px}.hidden{display:none!important}
@media(max-width:760px){.layout{grid-template-columns:1fr}nav{position:static;display:grid;grid-template-columns:1fr 1fr;gap:3px}nav button{font-size:13px;padding:9px}.brand{font-size:22px}h1{font-size:23px}}
</style></head><body>
<header><div class="wrap"><div class="brand" data-en="DRIVER HELP CENTER" data-es="CENTRO DE AYUDA PARA CONDUCTORES">DRIVER HELP CENTER</div>
<div class="sub" data-en="Simple step-by-step ELD instructions" data-es="Instrucciones sencillas del ELD paso a paso">Simple step-by-step ELD instructions</div></div></header>
<main class="wrap">
<section class="intro">
<h1 data-en="How can we help you?" data-es="¿Cómo podemos ayudarte?">How can we help you?</h1>
<p data-en="Choose your language and phone type. Then select the task you need help with. Follow each step and compare your screen with the pictures."
data-es="Elige tu idioma y el tipo de teléfono. Después selecciona el tema que necesitas. Sigue cada paso y compara tu pantalla con las imágenes."></p>
<div class="controls">
<button class="tab active" data-lang="en">English</button><button class="tab" data-lang="es">Español</button>
<span style="width:12px"></span><button class="tab active" data-platform="ios">iPhone / iOS</button><button class="tab" data-platform="android">Android</button>
</div>
<input id="search" class="search" type="search" placeholder="Search: login, Bluetooth, logs, DVIR...">
<div class="muted" data-en="Safety: Never use your phone while driving. Pull over and park in a safe place first."
data-es="Seguridad: Nunca uses el teléfono mientras conduces. Primero estaciónate en un lugar seguro."></div>
</section>
<div class="layout"><nav id="menu" aria-label="Guide topics">
<button class="active" data-section="start" data-en="1. Before you start" data-es="1. Antes de comenzar"></button>
<button data-section="login" data-en="2. Log in" data-es="2. Iniciar sesión"></button>
<button data-section="vehicle" data-en="3. Select your truck" data-es="3. Seleccionar camión"></button>
<button data-section="connect" data-en="4. Connect the ELD" data-es="4. Conectar el ELD"></button>
<button data-section="dashboard" data-en="5. Main screen" data-es="5. Pantalla principal"></button>
<button data-section="status" data-en="6. Duty status" data-es="6. Estado de servicio"></button>
<button data-section="certify" data-en="7. Certify your logs" data-es="7. Certificar registros"></button>
<button data-section="roadside" data-en="8. Roadside inspection" data-es="8. Inspección en carretera"></button>
<button data-section="dvir" data-en="9. Vehicle inspection (DVIR)" data-es="9. Inspección del vehículo (DVIR)"></button>
<button data-section="fix" data-en="10. Common problems" data-es="10. Problemas comunes"></button>
</nav><div class="content">
<section class="section active" id="start" data-search="before start setup bluetooth internet app engine ECM">
<h2 data-en="Before you start" data-es="Antes de comenzar"></h2>
<p data-en="Make sure you have these items ready:" data-es="Asegúrate de tener lo siguiente:"></p>
<div class="step"><b data-en="1. Your phone" data-es="1. Tu teléfono"></b><ul>
<li data-en="Turn Bluetooth ON." data-es="Activa el Bluetooth."></li><li data-en="Connect to the internet using mobile data or Wi-Fi." data-es="Conéctate a internet usando datos móviles o Wi-Fi."></li>
<li data-en="Allow the ELD app to use Bluetooth, location and network access." data-es="Permite que la aplicación ELD use Bluetooth, ubicación y acceso a internet."></li></ul></div>
<div class="step"><b data-en="2. Your truck and ELD device" data-es="2. Tu camión y dispositivo ELD"></b><ul>
<li data-en="The ELD device must be plugged into the truck's diagnostic port." data-es="El dispositivo ELD debe estar conectado al puerto de diagnóstico del camión."></li>
<li data-en="Turn the engine ON when connecting and checking engine data." data-es="Enciende el motor para conectar y revisar los datos del vehículo."></li>
<li data-en="Have your driver username and password ready." data-es="Ten listo tu usuario y contraseña de conductor."></li></ul></div>
<figure><img data-image="setup" alt="ELD setup example"><figcaption data-en="Setup example for reference." data-es="Ejemplo de configuración como referencia."></figcaption></figure>
<div class="callout" data-en="Important: Keep the ELD connected so it can receive engine data." data-es="Importante: Mantén el ELD conectado para que pueda recibir los datos del motor."></div></section>
<section class="section" id="login" data-search="login sign in username password account">
<h2 data-en="Log in to the ELD app" data-es="Iniciar sesión en la aplicación ELD"></h2>
<div class="step"><span class="stepnum">1</span><span data-en="Open the ELD app on your phone." data-es="Abre la aplicación ELD en tu teléfono."></span></div>
<div class="step"><span class="stepnum">2</span><span data-en="Enter your driver username and password." data-es="Escribe tu usuario y contraseña de conductor."></span></div>
<div class="step"><span class="stepnum">3</span><span data-en="Tap Login / Sign In and wait for your information to load." data-es="Presiona Login / Iniciar sesión y espera a que cargue tu información."></span></div>
<figure><img data-image="login" alt="Example login screen"><figcaption data-en="Example login screen. Your app may look different." data-es="Ejemplo de pantalla de inicio. Tu aplicación puede verse diferente."></figcaption></figure>
<div class="callout" data-en="Login problem? Check your username, password and internet connection. If your account is active on another device, contact your carrier or support team."
data-es="¿No puedes iniciar sesión? Revisa tu usuario, contraseña y conexión a internet. Si tu cuenta está activa en otro dispositivo, contacta a tu empresa o al equipo de soporte."></div></section>
<section class="section" id="vehicle" data-search="truck tractor trailer vehicle odometer">
<h2 data-en="Select your truck and trailer" data-es="Seleccionar tu camión y remolque"></h2>
<div class="step"><span class="stepnum">1</span><span data-en="Open the vehicle selection screen." data-es="Abre la pantalla de selección de vehículo."></span></div>
<div class="step"><span class="stepnum">2</span><span data-en="Select the correct truck from your company list." data-es="Selecciona el camión correcto de la lista de tu empresa."></span></div>
<div class="step"><span class="stepnum">3</span><span data-en="If allowed by your company, use the Add (+) option to add a vehicle." data-es="Si tu empresa lo permite, usa la opción Agregar (+) para añadir un vehículo."></span></div>
<div class="step"><span class="stepnum">4</span><span data-en="Enter the dashboard odometer reading if requested." data-es="Ingresa la lectura del odómetro si la aplicación lo solicita."></span></div>
<figure><img data-image="vehicle" alt="Vehicle selection example"><figcaption data-en="Vehicle selection example." data-es="Ejemplo de selección de vehículo."></figcaption></figure>
<div class="callout" data-en="Check that the truck and trailer information is correct before continuing." data-es="Verifica que la información del camión y del remolque sea correcta antes de continuar."></div></section>
<section class="section" id="connect" data-search="connect bluetooth ECM scan devices engine">
<h2 data-en="Connect the ELD to the truck" data-es="Conectar el ELD al camión"></h2>
<div class="step"><span class="stepnum">1</span><span data-en="Turn the truck engine ON." data-es="Enciende el motor del camión."></span></div>
<div class="step"><span class="stepnum">2</span><span data-en="Make sure Bluetooth is ON on your phone." data-es="Asegúrate de que el Bluetooth esté activado en tu teléfono."></span></div>
<div class="step"><span class="stepnum">3</span><span data-en="Open the device connection or scan option in the ELD app." data-es="Abre la opción de conexión o búsqueda de dispositivos en la aplicación ELD."></span></div>
<div class="step"><span class="stepnum">4</span><span data-en="Choose the correct device assigned to your truck and wait for it to connect." data-es="Selecciona el dispositivo asignado a tu camión y espera a que se conecte."></span></div>
<figure><img data-image="connect" alt="Device connection example"><figcaption data-en="Connection screen example." data-es="Ejemplo de pantalla de conexión."></figcaption></figure>
<div class="good" data-en="Connection check: Look for a connected or active status. If it shows an error, try connecting again to the correct device."
data-es="Verificación: Busca un estado que indique conectado o activo. Si aparece un error, intenta conectarte de nuevo al dispositivo correcto."></div></section>
<section class="section" id="dashboard" data-search="main screen dashboard driving time on duty cycle malfunction">
<h2 data-en="Understand the main screen" data-es="Conocer la pantalla principal"></h2>
<p data-en="The main screen shows your current duty status and available driving/on-duty time." data-es="La pantalla principal muestra tu estado de servicio y el tiempo disponible de conducción y trabajo."></p>
<div class="step"><ul>
<li data-en="Driving: driving time used and available." data-es="Driving (Conducción): tiempo de conducción usado y disponible."></li>
<li data-en="On Duty: on-duty time used and available." data-es="On Duty (En servicio): tiempo de trabajo usado y disponible."></li>
<li data-en="Cycle: remaining cycle time." data-es="Cycle (Ciclo): tiempo restante del ciclo."></li>
<li data-en="Current Status: your duty status right now." data-es="Current Status (Estado actual): tu estado de servicio en este momento."></li>
<li data-en="Alerts: warnings or ELD issues that may need attention." data-es="Alertas: avisos o problemas del ELD que pueden necesitar atención."></li></ul></div>
<figure><img data-image="dashboard" alt="ELD main screen example"><figcaption data-en="Main screen example. The layout may vary." data-es="Ejemplo de pantalla principal. El diseño puede variar."></figcaption></figure></section>
<section class="section" id="status" data-search="change duty status off duty sleeper berth driving on duty personal yard">
<h2 data-en="Change your duty status" data-es="Cambiar tu estado de servicio"></h2>
<div class="step"><span class="stepnum">1</span><span data-en="Park safely before using your phone." data-es="Estaciónate de forma segura antes de usar tu teléfono."></span></div>
<div class="step"><span class="stepnum">2</span><span data-en="Select the correct status: Off Duty, Sleeper Berth, On Duty or another available option." data-es="Selecciona el estado correcto: Off Duty (Fuera de servicio), Sleeper Berth (Litera), On Duty (En servicio) u otra opción disponible."></span></div>
<div class="step"><span class="stepnum">3</span><span data-en="If asked, select or enter a remark explaining the change." data-es="Si te lo solicita, selecciona o escribe un comentario que explique el cambio."></span></div>
<figure><img data-image="status" alt="Duty status example"><figcaption data-en="Duty status example." data-es="Ejemplo de estado de servicio."></figcaption></figure>
<div class="callout" data-en="Personal Use (PU) and Yard Move (YM): Use these options only when your carrier allows them and the rules apply. Follow your company's instructions."
data-es="Personal Use (PU) y Yard Move (YM): Usa estas opciones solo cuando tu empresa las permita y las reglas correspondientes apliquen. Sigue las instrucciones de tu empresa."></div></section>
<section class="section" id="certify" data-search="certify logs certify records logbook">
<h2 data-en="Certify your logs" data-es="Certificar tus registros"></h2>
<div class="step"><span class="stepnum">1</span><span data-en="Open the app menu." data-es="Abre el menú de la aplicación."></span></div>
<div class="step"><span class="stepnum">2</span><span data-en="Select Certify Logs or the equivalent option." data-es="Selecciona Certify Logs (Certificar registros) o la opción equivalente."></span></div>
<div class="step"><span class="stepnum">3</span><span data-en="Select the date or 24-hour period you need to certify." data-es="Selecciona la fecha o el período de 24 horas que necesitas certificar."></span></div>
<div class="step"><span class="stepnum">4</span><span data-en="Review your records, then tap Certify and accept the statement." data-es="Revisa tus registros, presiona Certify (Certificar) y acepta la declaración."></span></div>
<figure><img data-image="certify" alt="Log certification example"><figcaption data-en="Log certification example." data-es="Ejemplo de certificación de registros."></figcaption></figure>
<div class="callout" data-en="Review your logs carefully before certifying. Report any errors to your carrier." data-es="Revisa tus registros con cuidado antes de certificarlos. Informa cualquier error a tu empresa."></div></section>
<section class="section" id="roadside" data-search="roadside inspection DOT MTO export logs print display data file">
<h2 data-en="Roadside inspection" data-es="Inspección en carretera"></h2>
<div class="step"><span class="stepnum">1</span><span data-en="When safely parked, open Roadside Inspection mode or the inspection option." data-es="Cuando estés estacionado de forma segura, abre el modo Roadside Inspection (Inspección en carretera) o la opción de inspección."></span></div>
<div class="step"><span class="stepnum">2</span><span data-en="Choose the option requested by the officer, such as displaying logs or sending an ELD data file." data-es="Elige la opción que solicite el oficial, como mostrar los registros o enviar un archivo de datos ELD."></span></div>
<div class="step"><span class="stepnum">3</span><span data-en="Follow the instructions shown in the app and the officer's directions." data-es="Sigue las instrucciones de la aplicación y las indicaciones del oficial."></span></div>
<figure><img data-image="roadside" alt="Roadside inspection example"><figcaption data-en="Inspection screen example." data-es="Ejemplo de pantalla de inspección."></figcaption></figure>
<div class="callout" data-en="Follow your carrier's inspection process and the officer's instructions." data-es="Sigue el proceso de inspección de tu empresa y las instrucciones del oficial."></div></section>
<section class="section" id="dvir" data-search="DVIR inspection report truck trailer defects pictures signature upload">
<h2 data-en="Complete a vehicle inspection (DVIR)" data-es="Completar una inspección del vehículo (DVIR)"></h2>
<div class="step"><span class="stepnum">1</span><span data-en="Open DVIR, Vehicle Inspection or Inspection Reports from the app menu." data-es="Abre DVIR, Vehicle Inspection (Inspección del vehículo) o Inspection Reports (Informes de inspección) desde el menú."></span></div>
<div class="step"><span class="stepnum">2</span><span data-en="Start a new inspection using the Add (+) option, if shown." data-es="Inicia una nueva inspección usando la opción Agregar (+), si aparece."></span></div>
<div class="step"><span class="stepnum">3</span><span data-en="Select the correct vehicle and review each inspection item." data-es="Selecciona el vehículo correcto y revisa cada punto de inspección."></span></div>
<div class="step"><span class="stepnum">4</span><span data-en="Report defects. Add notes and photos when needed." data-es="Reporta los defectos. Agrega notas y fotografías cuando sea necesario."></span></div>
<div class="step"><span class="stepnum">5</span><span data-en="Sign the report and submit or upload it." data-es="Firma el informe y envíalo o súbelo."></span></div>
<figure><img data-image="dvir" alt="DVIR example"><figcaption data-en="Vehicle inspection example." data-es="Ejemplo de inspección del vehículo."></figcaption></figure>
<div class="callout" data-en="Always report safety-related defects before operating the vehicle." data-es="Siempre reporta los defectos relacionados con la seguridad antes de operar el vehículo."></div></section>
<section class="section" id="fix" data-search="troubleshooting problem red bluetooth ECM no internet diagnostics malfunction">
<h2 data-en="Common problems" data-es="Problemas comunes"></h2>
<div class="step"><h3 data-en="Bluetooth or vehicle connection is not working" data-es="El Bluetooth o la conexión del vehículo no funciona"></h3><ol>
<li data-en="Park safely and turn the engine ON if required." data-es="Estaciónate de forma segura y enciende el motor si es necesario."></li>
<li data-en="Check that Bluetooth is ON." data-es="Verifica que el Bluetooth esté activado."></li>
<li data-en="Make sure the ELD device is firmly connected to the diagnostic port." data-es="Asegúrate de que el dispositivo ELD esté bien conectado al puerto de diagnóstico."></li>
<li data-en="Open the connection screen and try again." data-es="Abre la pantalla de conexión e intenta de nuevo."></li></ol></div>
<div class="step"><h3 data-en="Login or authentication error" data-es="Error de inicio de sesión o autenticación"></h3><ul>
<li data-en="Check your username and password." data-es="Revisa tu usuario y contraseña."></li><li data-en="Check your internet connection." data-es="Revisa tu conexión a internet."></li>
<li data-en="Contact your carrier if the error continues." data-es="Contacta a tu empresa si el error continúa."></li></ul></div>
<div class="step"><h3 data-en="The app cannot load information" data-es="La aplicación no puede cargar información"></h3><ul>
<li data-en="Check mobile data or Wi-Fi." data-es="Revisa los datos móviles o el Wi-Fi."></li><li data-en="Close and reopen the app when safely parked." data-es="Cierra y vuelve a abrir la aplicación cuando estés estacionado de forma segura."></li><li data-en="Contact support if the issue continues." data-es="Contacta a soporte si el problema continúa."></li></ul></div>
<div class="step"><h3 data-en="Time or date warning" data-es="Aviso de hora o fecha"></h3><p data-en="Check that your phone's date, time and time zone are set automatically. Do not change ELD records manually."
data-es="Verifica que la fecha, hora y zona horaria de tu teléfono estén configuradas automáticamente. No cambies los registros ELD manualmente."></p></div>
<figure><img data-image="troubleshoot" alt="Troubleshooting example"><figcaption data-en="Diagnostic example." data-es="Ejemplo de diagnóstico."></figcaption></figure>
<div class="good" data-en="Still need help? Contact your dispatcher, carrier or ELD support team. Share the exact error message and a screenshot if requested."
data-es="¿Necesitas más ayuda? Contacta a tu despachador, empresa o equipo de soporte ELD. Comparte el mensaje exacto del error y una captura de pantalla si te la solicitan."></div></section>
<p class="muted" data-en="This is a general quick-reference guide. App screens and menu names may vary by ELD provider, device and company settings. Always follow your carrier's instructions, official ELD documentation and applicable regulations."
data-es="Esta es una guía general de consulta rápida. Las pantallas y los nombres de los menús pueden variar según el proveedor ELD, el dispositivo y la configuración de la empresa. Sigue siempre las instrucciones de tu empresa, la documentación oficial del ELD y las regulaciones aplicables."></p>
</div></div></main>
<footer data-en="Driver Help Center · Quick reference for drivers" data-es="Centro de ayuda para conductores · Guía rápida de consulta"></footer>
<script>
let language='en',platform='ios';
const langButtons=[...document.querySelectorAll('[data-lang]')], platformButtons=[...document.querySelectorAll('[data-platform]')];
function setLanguage(l){language=l;document.documentElement.lang=l;document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset[l]||'';});langButtons.forEach(b=>b.classList.toggle('active',b.dataset.lang===l));document.getElementById('search').placeholder=l==='en'?'Search: login, Bluetooth, logs, DVIR...':'Buscar: inicio de sesión, Bluetooth, registros, DVIR...';}
function setPlatform(p){platform=p;platformButtons.forEach(b=>b.classList.toggle('active',b.dataset.platform===p));document.querySelectorAll('img[data-image]').forEach(img=>{img.src='assets/'+platform+'-'+img.dataset.image+'.jpg';});}
function showSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===id));}
langButtons.forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
platformButtons.forEach(b=>b.addEventListener('click',()=>setPlatform(b.dataset.platform)));
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showSection(b.dataset.section)));
document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.toLowerCase().trim(),first=null;document.querySelectorAll('nav button').forEach(b=>{let s=document.getElementById(b.dataset.section),m=!q||(s.innerText+' '+(s.dataset.search||'')).toLowerCase().includes(q);b.classList.toggle('hidden',!m);if(m&&!first)first=b.dataset.section;});if(first)showSection(first);});
setLanguage('en');setPlatform('ios');
</script></body></html>
